<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Madhurya Innovations</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 3rem;
            color: #1e3c72;
            position: relative;
        }

        .dashboard-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .dashboard-header p {
            color: #666;
            font-size: 1.1rem;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .dashboard-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .dashboard-card i {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: #1e3c72;
        }

        .dashboard-card h2 {
            color: #1e3c72;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .dashboard-card p {
            color: #666;
            margin-bottom: 1.5rem;
        }

        .card-btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .card-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(30,60,114,0.2);
        }

        .logout-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .dashboard-header h1 {
                font-size: 2rem;
            }

            .dashboard-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <a href="/admin/logout" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>

        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <p>Manage your website content</p>
        </div>

        <div class="dashboard-cards">
            <div class="dashboard-card" onclick="location.href='/admin/gallery'">
                <i class="fas fa-images"></i>
                <h2>Upload Images</h2>
                <p>Add or manage images in your gallery</p>
                <a href="/admin/gallery" class="card-btn">Manage Gallery</a>
            </div>

            <div class="dashboard-card" onclick="location.href='/admin/appointments'">
                <i class="fas fa-calendar-check"></i>
                <h2>View Appointments</h2>
                <p>Check and manage customer appointments</p>
                <a href="/admin/appointments" class="card-btn">View Appointments</a>
            </div>
        </div>
    </div>
</body>
</html>
