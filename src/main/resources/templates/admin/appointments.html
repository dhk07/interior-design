<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Madhurya Innovations</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-btn {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .appointments-table {
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e1e8f5;
        }

        th {
            background: #1e3c72;
            color: white;
        }

        tr:hover {
            background: #f8fafd;
        }

        .status-pending {
            color: #d97706;
            background: #fef3c7;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-confirmed {
            color: #059669;
            background: #d1fae5;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .confirm-btn {
            background: #059669;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        @media (max-width: 768px) {
            .appointments-table {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Appointments</h1>
            <a href="/admin" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div class="appointments-table">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Property Type</th>
                        <th>BHK Type</th>
                        <th>Address</th>
                        <th>Date & Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appointment : ${appointments}">
                        <td th:text="${appointment.customerName}"></td>
                        <td th:text="${appointment.customerMobile}"></td>
                        <td th:text="${appointment.propertyType}"></td>
                        <td th:text="${appointment.bhkType}"></td>
                        <td th:text="${appointment.customerAddress}"></td>
                        <td th:text="${#temporals.format(appointment.appointmentDateTime, 'dd-MM-yyyy HH:mm')}"></td>
                        <td>
                            <span th:class="${appointment.status == 'CONFIRMED'} ? 'status-confirmed' : 'status-pending'"
                                  th:text="${appointment.status}">
                            </span>
                        </td>
                        <td>
                            <form th:if="${appointment.status != 'CONFIRMED'}" 
                                  th:action="@{/admin/appointments/confirm/{id}(id=${appointment.id})}" 
                                  method="post" style="display: inline;">
                                <button type="submit" class="action-btn confirm-btn">Confirm</button>
                            </form>
                            <form th:action="@{/admin/appointments/delete/{id}(id=${appointment.id})}" 
                                  method="post" style="display: inline;">
                                <button type="submit" class="action-btn delete-btn">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
