<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Madhurya Innovations</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .contact-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .contact-card h1 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .contact-item {
            text-align: center;
            padding: 2rem;
            border-radius: 15px;
            background: #f8fafd;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .contact-item h3 {
            color: #1e3c72;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .contact-item p, 
        .contact-item a {
            color: #666;
            line-height: 1.6;
            margin: 0.5rem 0;
        }

        .whatsapp-btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: #25D366;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            margin: 0.5rem 0;
            transition: all 0.3s ease;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }

        .navbar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            background: rgba(255,255,255,0.1);
        }

        .navbar a.active {
            background: rgba(255,255,255,0.2);
        }

        .admin-btn {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white !important;
            padding: 8px 16px !important;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        @media (max-width: 768px) {
            .contact-card {
                padding: 1.5rem;
            }

            .contact-card h1 {
                font-size: 2rem;
            }

            .contact-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/gallery">Gallery</a>
        <a href="/contact" class="active">Contact</a>
        <a href="/admin/login" class="admin-btn">Admin Panel</a>
    </nav>

    <div class="container">
        <div class="contact-card">
            <h1>Contact Us</h1>
            <div class="contact-info">
                <div class="contact-item">
                    <h3>WhatsApp</h3>
                    <a href="https://wa.me/918891091023" class="whatsapp-btn">
                        Chat with us: +91 8891091023
                    </a>
                    <a href="https://wa.me/919696969555" class="whatsapp-btn">
                        Chat with us: +91 9696969555
                    </a>
                </div>
                
                <div class="contact-item">
                    <h3>Visit Us</h3>
                    <p>Shop No 05, opp. SBI Bank</p>
                    <p>Near St. Marry School, sec-82</p>
                    <p>Bhatola road, Gr Fbd</p>
                </div>

                <div class="contact-item">
                    <h3>Email</h3>
                    <a href="mailto:madhuryainnovations@gmail.com">madhuryainnovations@gmail.com</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
